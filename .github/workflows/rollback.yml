name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Commit hash to rollback to'
        required: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Rollback to target commit
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          git read-tree -um $TARGET_COMMIT
          git commit -m "Rollback to $TARGET_COMMIT"
          git push origin HEAD:${{ github.ref_name }}
