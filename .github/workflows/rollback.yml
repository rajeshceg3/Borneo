name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'The commit SHA to rollback to'
        required: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Revert tree to target commit
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          git read-tree -u --reset $TARGET_COMMIT

      - name: Commit rollback
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          git commit -m "Rollback to commit $TARGET_COMMIT"

      - name: Push rollback
        run: |
          git push origin HEAD:${{ github.ref_name }}