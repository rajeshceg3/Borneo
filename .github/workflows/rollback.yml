name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'The commit SHA to rollback to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Perform Rollback
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          # Revert working tree to target commit
          git read-tree -um HEAD $TARGET_COMMIT

          # Create a rollback commit
          git commit -m "Rollback to commit $TARGET_COMMIT"

          # Push the new commit to the current branch
          git push origin HEAD:${{ github.ref_name }}
