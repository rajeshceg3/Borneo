name: Rollback Pipeline

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'The Git SHA of the commit to rollback to'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Revert working tree
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          git read-tree -um HEAD $TARGET_COMMIT
          git commit -m "Rollback to $TARGET_COMMIT"

      - name: Push rollback commit
        run: git push origin HEAD:${{ github.ref_name }}
