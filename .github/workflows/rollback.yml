name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'The commit hash to rollback to'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rollback via Git Read-Tree
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          git read-tree -u --reset "$TARGET_COMMIT"
          git commit -m "Rollback to commit $TARGET_COMMIT"
          git push origin HEAD:${{ github.ref_name }}
