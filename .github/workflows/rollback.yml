name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'The commit SHA to rollback to'
        required: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Perform Rollback
        env:
          TARGET_COMMIT: ${{ github.event.inputs.target_commit }}
        run: |
          # Use git read-tree to revert to the target commit
          git read-tree -u --reset $TARGET_COMMIT

          # Create a new commit to represent the rollback
          git commit -m "Rollback to commit $TARGET_COMMIT"

          # Push the new commit back to the current branch
          git push origin HEAD:${{ github.ref_name }}
