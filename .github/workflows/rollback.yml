name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'The exact Git Commit SHA to rollback to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Perform Rollback
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          echo "Rolling back to commit: $TARGET_COMMIT"
          git read-tree -um @ $TARGET_COMMIT
          git commit -m "Rollback to commit $TARGET_COMMIT"
          git push origin HEAD:${{ github.ref_name }}
